name: Build RootHide deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      FINALPACKAGE: 1
      PREFIX: /Applications/Xcode_16.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install tools, RootHide Theos and SDK
        run: |
          brew install dpkg ldid make
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks" && cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build package
        run: |
          set -o pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          make package TARGET=iphone:clang:"$(xcrun --sdk iphoneos --show-sdk-version)":15.0 SYSROOT="$SYSROOT" 2>&1 | tee /tmp/build.log
          ! grep -F "incompatible arm64e ABI compiler" /tmp/build.log

      - name: Verify package
        run: |
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e
          dpkg-deb -c "$deb" | tee /tmp/list.txt
          grep -q 'Battery27.dylib' /tmp/list.txt
          dpkg-deb -x "$deb" /tmp/pkg && plutil -p /tmp/pkg/Library/MobileSubstrate/DynamicLibraries/Battery27.plist | tee /dev/stderr | grep -q com.apple.springboard

      # iOS 15 libobjc kills the process loading a binary whose class pointers are unsigned (SafariModernizer 1.0.1)
      - name: Verify ObjC pointer signing
        run: |
          find .theos/_ -type f -exec file {} + | grep -v '(for architecture' | sed -n 's/: *Mach-O.*//p' > "$RUNNER_TEMP/macho.txt"
          test -s "$RUNNER_TEMP/macho.txt"
          cat "$RUNNER_TEMP/macho.txt"
          tr '\n' '\0' < "$RUNNER_TEMP/macho.txt" | xargs -0 python3 tools/check_objc_ptrauth.py

      # artifact storage quota is shared account-wide; release assets don't count against it
      - name: Upload deb to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          tag="v$(dpkg-deb -f "$deb" Version)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "$tag" --notes "Auto build ${GITHUB_SHA::7}"
          gh release upload "$tag" "$deb" --clobber
